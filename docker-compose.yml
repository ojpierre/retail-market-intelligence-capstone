version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_warehouse_pg
    environment:
      POSTGRES_DB: retail_dw
      POSTGRES_USER: de_user
      POSTGRES_PASSWORD: de_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ddl_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U de_user -d retail_dw"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: retail_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: retail_kafka_broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  init-kafka-topics:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - kafka
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      # Block until Kafka is reachable
      kafka-topics --bootstrap-server kafka:9092 --list
      echo -e 'Creating Kafka topics...'
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic retail.pos.transactions --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic retail.inventory.movements --partitions 4 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic market.price.alerts --partitions 2 --replication-factor 1
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic retail.dlq.errors --partitions 1 --replication-factor 1
      echo -e 'Successfully created Kafka topics:'
      kafka-topics --bootstrap-server kafka:9092 --list
      "

  pipeline-master:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retail_pipeline_master
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://de_user:de_secure_password@postgres:5432/retail_dw
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    command: python src/main.py --mode replace

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: retail_analytics_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+psycopg2://de_user:de_secure_password@postgres:5432/retail_dw
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

volumes:
  pgdata:
